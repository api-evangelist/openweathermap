aid: openweathermap
name: OpenWeatherMap
description: OpenWeather (operating openweathermap.org) is a global weather data platform delivering current
  weather, multi-horizon forecasts, historical archives, climate statistics, air pollution, solar irradiance,
  road risk, geocoding, and weather map tiles. Data is sourced from satellites, weather models, radars,
  and a worldwide network of weather stations, served through REST APIs across a freemium, multi-tier,
  and pay-per-call commercial model.
url: https://openweathermap.org/api
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
  label: Hosted service · you call their endpoint
  confidence: high
  source:
  - openapi
  - pricing
  generated: '2026-08-28'
  method: derived
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: medium
  source:
  - plans
  - authentication
  - security
  generated: '2026-09-03'
  method: derived
specificationVersion: '0.23'
created: '2026-05-28'
modified: '2026-06-20'
x-source: public-apis/public-apis
x-category: Weather
x-tier: 2
x-tier-reason: comprehensive-weather-suite-with-multi-tier-pricing
image: https://openweathermap.org/themes/openweathermap/assets/img/logo_white_cropped.png
tags:
- Weather
- Forecast
- Climate
- Air Pollution
- Air Quality
- Solar
- Geocoding
- History
- Maps
- Road Risk
- Public APIs
